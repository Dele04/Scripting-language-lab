<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Inventory Management</title>
    <script src="j02_example04.js" defer></script>
    <link rel="stylesheet" href="j02_example04.css">
</head>
<body>

    <h1>Car Inventory System</h1>

    <div class="form-container">
        <input type="text" id="car-manufacturer" placeholder="Make">
        <input type="text" id="car-model" placeholder="Model">
        <input type="number" id="car-year" placeholder="Year">
        <button onclick="addCar()">Add Car</button>
    </div>

    <h2>Current Inventory</h2>
    <ul id="car-list"></ul>

</body>
